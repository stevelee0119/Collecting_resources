name: 인증정보 점검

# 수동 실행 전용입니다. 자동으로 돌지 않습니다.
# GitHub Secrets 는 워크플로 실행 중에만 환경변수로 주입되므로,
# Secrets 가 실제로 동작하는지는 이 워크플로로만 확인할 수 있습니다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Secrets 주입 상태 점검
    runs-on: ubuntu-latest

    # Secrets 를 프로그램이 읽는 환경변수 이름으로 매핑합니다.
    # 등록하지 않은 Secret 은 빈 문자열이 되고, 프로그램은 해당 소스를 건너뜁니다.
    env:
      # --- 공통 ---
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      # --- 국내 학술·정책 ---
      KCI_API_KEY: ${{ secrets.KCI_API_KEY }}
      RISS_API_KEY: ${{ secrets.RISS_API_KEY }}
      SCIENCEON_CLIENT_ID: ${{ secrets.SCIENCEON_CLIENT_ID }}
      SCIENCEON_API_KEY: ${{ secrets.SCIENCEON_API_KEY }}
      NKIS_API_KEY: ${{ secrets.NKIS_API_KEY }}
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
      # --- 해외 학술 ---
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
      DOAJ_API_KEY: ${{ secrets.DOAJ_API_KEY }}
      ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
      # --- 알림 ---
      DLRCIS_SENDER_EMAIL: ${{ secrets.DLRCIS_SENDER_EMAIL }}
      DLRCIS_RECEIVER_EMAIL: ${{ secrets.DLRCIS_RECEIVER_EMAIL }}
      DLRCIS_SMTP_PASSWORD: ${{ secrets.DLRCIS_SMTP_PASSWORD }}
      # --- 요약 (선택) ---
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 설정·인증정보 점검
        # doctor 는 인증정보를 마스킹해서 출력합니다 (값 자체는 찍히지 않습니다).
        run: python main.py doctor

      - name: 실제 호출 점검 (인증이 통하는지 확인)
        # doctor 기본 점검은 "값이 있는가"만 보지만, 여기서는 소스마다 실제로
        # 1회 호출해 키가 유효한지 확인합니다. 실패해도 워크플로는 계속됩니다.
        continue-on-error: true
        run: python main.py doctor --probe

      - name: 검색어 사전 점검
        run: python scripts/check_search_terms.py

      - name: 인증정보 배선 검증
        run: python -m pytest tests/test_acceptance.py -q

      - name: Secrets 기준으로 API 가이드 재생성
        run: python main.py api-guide --excel

      - name: 재생성된 가이드 업로드
        uses: actions/upload-artifact@v4
        with:
          name: api-guide-secrets-기준
          path: |
            docs/API_발급_연동_가이드.md
            docs/API_발급_연동_가이드.xlsx
          retention-days: 14

      - name: 요약을 실행 결과에 표시
        if: always()
        run: |
          {
            echo "## 인증정보 점검 결과"
            echo ""
            echo "아래는 Secrets 가 주입된 상태에서 확인한 실제 상태입니다."
            echo ""
            echo '```'
            python main.py doctor 2>&1 | sed -n '/소스별 인증정보/,/사용 가능 소스/p'
            echo '```'
            echo ""
            echo "### 실제 호출 결과 (키가 유효한지)"
            echo ""
            echo '```'
            python main.py doctor --probe 2>&1 | sed -n '/실제 호출 점검/,$p' || true
            echo '```'
            echo ""
            echo "재생성된 가이드는 이 실행의 **Artifacts** 에서 내려받을 수 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"
