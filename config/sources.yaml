# =============================================================================
# Source Registry (PRD v2.1 §5)
#
# 모든 출처는 여기에 등록합니다. 코드에 도메인·엔드포인트를 하드코딩하지 않습니다.
#
# verification_status 값의 의미:
#   VERIFIED             - 공식 문서를 확인하여 엔드포인트/인증방식을 확정함
#   PENDING_VERIFICATION - Connector 구현·운영 직전 공식 문서 재확인 필요 (§5.1 최신성 원칙)
#
# 확인 근거는 감사가능성(§18.4)을 위해 함께 기록합니다:
#   verified_source - 확인 근거가 된 공식 문서 URL
#   verified_at     - 확인 일자
#   verified_method - official_doc(직접 열람) / web_search(공식 문서 검색결과) / none
#
# 확인되지 않은 항목의 endpoint 는 비워 둡니다(URL 을 추측해 넣지 않습니다).
# endpoint 가 비어 있으면 해당 소스의 자동수집을 시도하지 않고 건너뜁니다.
#
# credential_env_var 에는 "변수명"만 적습니다. 실제 키는 .env 에 보관하고
# 절대 이 파일이나 docs/ 문서에 기록하지 않습니다 (§5.1 보안 원칙).
# =============================================================================

registry_version: "2026.08.22-1"

defaults:
  robots_policy: respect
  max_concurrency: 2
  retry_policy:
    max_attempts: 3
    backoff: exponential
  lookback_days: 3

sources:

  # ===========================================================================
  # 국내 학술·정책 핵심 소스 (§4.2)
  # ===========================================================================

  - source_id: kci
    name: "KCI 한국학술지인용색인"
    base_domain: kci.go.kr
    connector: kci
    mode: [QUERY, FEED]
    query_language: ko
    priority: 1
    enabled: true
    access_methods:
      # 공식 OAI-PMH 안내 페이지에서 확인한 base URL.
      # ListRecords 예: {endpoint}?verb=ListRecords&metadataPrefix=oai_dc
      - type: OAI_PMH
        auth_type: NONE
        credential_required: false
        credential_env_var: null
        endpoint: "https://open.kci.go.kr/oai/request"
        verification_status: VERIFIED
        verified_source: "https://www.kci.go.kr/kciportal/po/openapi/openDataOaiPmhView.kci"
        verified_at: "2026-08-22"
        verified_method: web_search
      # 공식 활용방법 페이지의 예시 URL 기준:
      # openApiSearch.kci?apiCode=articleSearch&key=...&title=...&author=...&pubiYr=...
      - type: OPEN_API
        auth_type: API_KEY
        credential_required: true
        credential_env_var: KCI_API_KEY
        endpoint: "https://open.kci.go.kr/po/openapi/openApiSearch.kci"
        verification_status: VERIFIED
        verified_source: "https://www.kci.go.kr/kciportal/po/openapi/openApiConnSamp.kci"
        verified_at: "2026-08-22"
        verified_method: web_search
    credential_guide_required: true
    auth_docs_url: "https://www.kci.go.kr/kciportal/po/openapi/openApiList.kci"
    contact_or_policy_url: "https://www.kci.go.kr/kciportal/po/openapi/openDataOaiPmhView.kci"
    # 공식 문서상 제공 API: articleSearch / articleDetail / referenceSearch / citation / citationDetail
    kci_api_code: "articleSearch"
    robots_policy: respect
    terms_checked_at: "2026-08-22"
    last_policy_review_at: "2026-08-22"
    download_policy: oa_only
    rate_limit_rps: 0.5
    lookback_days: 3
    oai_metadata_prefix: "oai_dc"
    notes: "OAI-PMH 는 키 없이 사용할 수 있는 공개 메타데이터 경로로 우선 검토(§4.2 A)."

  - source_id: riss
    name: "RISS 학술연구정보서비스"
    base_domain: riss.kr
    connector: riss
    mode: [QUERY, LINK_ONLY]
    query_language: ko
    priority: 2
    enabled: true
    access_methods:
      # RISS API 센터가 공개하는 API 는 상호대차(ILL)·E-DDS 신청, Rinfo 통계,
      # FRIC 소장자원 검색용이며, 일반 학술 서지 검색 API 는 제공되지 않습니다.
      # 따라서 endpoint 를 비워 두고 자동수집을 시도하지 않습니다.
      - type: OPEN_API
        auth_type: INSTITUTION_APPROVAL
        credential_required: true
        credential_env_var: RISS_API_KEY
        endpoint: ""
        verification_status: VERIFIED
        verified_source: "https://www.riss.kr/apicenter/apiMain.do"
        verified_at: "2026-08-22"
        verified_method: web_search
    credential_guide_required: true
    auth_docs_url: "https://www.riss.kr/apicenter/apiMain.do"
    contact_or_policy_url: "https://www.riss.kr/apicenter/apiMain.do"
    robots_policy: respect
    terms_checked_at: "2026-08-22"
    last_policy_review_at: "2026-08-22"
    # 승인 전에는 대량 크롤링하지 않고 Landing Page 만 보존 (§4.2 B)
    download_policy: link_only
    rate_limit_rps: 0.2
    lookback_days: 3
    notes: >-
      RISS API 센터 확인 결과 공개 API 는 상호대차·E-DDS·Rinfo 통계·FRIC 검색용이며
      일반 학술 서지 검색 API 는 제공되지 않습니다. 직접 크롤링하지 않고,
      다른 소스가 발견한 RISS 링크만 Landing Page 로 보존합니다.
      원문은 KCI·ScienceON·기관 리포지터리의 공개본으로 확보합니다.

  - source_id: scienceon
    name: "ScienceON (KISTI)"
    base_domain: scienceon.kisti.re.kr
    connector: scienceon
    mode: [QUERY, OA_RESOLVER]
    query_language: ko
    priority: 2
    enabled: true
    access_methods:
      - type: OPEN_API
        auth_type: API_KEY
        credential_required: true
        credential_env_var: SCIENCEON_API_KEY
        endpoint: "https://apigateway.kisti.re.kr/openapicall.do"
        verification_status: VERIFIED
        verified_source: "https://scienceon.kisti.re.kr/apigateway/api/way/service/arti/serviceArtiSearchApi.do"
        verified_at: "2026-08-22"
        verified_method: web_search
    credential_guide_required: true
    auth_docs_url: "https://scienceon.kisti.re.kr/apigateway/api/main/mainForm.do"
    contact_or_policy_url: "https://scienceon.kisti.re.kr/por/oapi/openApi.do"
    robots_policy: respect
    terms_checked_at: "2026-08-22"
    last_policy_review_at: "2026-08-22"
    download_policy: oa_only
    rate_limit_rps: 0.5
    lookback_days: 3
    # 공식 API Gateway 명세 기준 요청 파라미터
    # (client_id + token 조합으로 인증하며, searchQuery 는 JSON 문자열입니다)
    request:
      method: GET
      format: xml
      key_param: token
      query_param: searchQuery
      page_size_param: rowCount
      page_size: 50
      static_params:
        version: "1.0"
        action: "search"
        target: "ARTI"
        curPage: 1
      records_node: record
    # client_id 는 토큰과 별도로 발급되는 값입니다.
    client_id_env_var: SCIENCEON_CLIENT_ID
    notes: >-
      ScienceON API Gateway 는 client_id 와 token(ACCESS_TOKEN)을 함께 요구합니다.
      searchQuery 는 JSON 형식 문자열이며, 응답 항목 코드는 include 파라미터로 지정합니다.

  - source_id: nkis
    name: "NKIS 국가정책연구포털"
    base_domain: nkis.re.kr
    connector: nkis
    mode: [FULL, QUERY]
    query_language: ko
    priority: 1
    enabled: true
    access_methods:
      # 엔드포인트는 운영자가 NKIS 오픈API 목록(openSvcList.do, 로그인 필요)에서
      # 확인해 입력했습니다. 공식 문서를 직접 대조하지는 못했으므로
      # verification_status 는 PENDING_VERIFICATION 로 둡니다.
      # `python main.py doctor --probe` 로 실제 응답을 확인하십시오.
      - type: OPEN_API
        auth_type: API_KEY
        credential_required: true
        credential_env_var: NKIS_API_KEY
        endpoint: "https://nkis.re.kr/nkisApi/search/TongList.do"
        verification_status: PENDING_VERIFICATION
        verified_source: "https://www.nkis.re.kr/openSvcList.do"
        verified_at: "2026-08-23"
        verified_method: operator_input
    credential_guide_required: true
    auth_docs_url: "https://www.nkis.re.kr/openDesc.do"
    contact_or_policy_url: "https://www.nkis.re.kr/apiIntro.do"
    robots_policy: respect
    terms_checked_at: "2026-08-22"
    last_policy_review_at: "2026-08-22"
    download_policy: allowed
    rate_limit_rps: 0.5
    lookback_days: 3
    notes: >-
      인증키 발급은 회원가입 후 로그인 상태에서 신청합니다(openDesc.do).
      엔드포인트는 입력되었으나 request/field_map 은 아직 기본값(공공데이터포털 표준 형식)
      이므로, NKIS 자체 API 의 실제 요청인자·응답 필드명과 다르면 결과가 0건으로 나옵니다.
      openSvcList.do 의 '요청인자'·'출력결과' 표를 보고 아래 request/field_map 을 맞추십시오.
      확인은 `python main.py doctor --probe` 로 합니다.

  - source_id: kknowledge
    name: "디지털집현전 (국가지식정보 통합플랫폼)"
    base_domain: k-knowledge.kr
    connector: kknowledge
    mode: [FULL, QUERY]
    query_language: ko
    priority: 2
    enabled: true
    access_methods:
      # 디지털집현전은 두 종류의 Open API 를 제공합니다.
      #   1) 국가지식정보를 메타데이터로 제공하는 API
      #   2) 디지털집현전이 보유한 국가지식정보 검색용 API  <- 이 Connector 가 사용
      # 상세주소·요청인자·응답 필드는 서비스 신청 승인 후 발급되는 명세에만
      # 공개되므로, 확인 전까지 endpoint 를 비워 둡니다(추측 금지, §5.1).
      - type: OPEN_API
        auth_type: API_KEY
        credential_required: true
        credential_env_var: KKNOWLEDGE_API_KEY
        endpoint: ""
        verification_status: PENDING_VERIFICATION
        verified_source: "https://metadash.k-knowledge.kr/openApiService/apisso/business"
        verified_at: "2026-08-23"
        verified_method: web_search
    credential_guide_required: true
    auth_docs_url: "https://metadash.k-knowledge.kr/openApiService/apisso/business"
    contact_or_policy_url: "https://k-knowledge.kr/m/guide/nkiLink.jsp"
    robots_policy: respect
    terms_checked_at: "2026-08-23"
    last_policy_review_at: "2026-08-23"
    download_policy: link_only
    rate_limit_rps: 0.5
    lookback_days: 3
    notes: >-
      국가기관·지자체·공공기관이 생산한 지식정보를 표준 메타데이터(제목·날짜·저자·요약·주제어)로
      모아 제공하는 통합 플랫폼입니다. 회원가입 후 metadash 에서 서비스를 신청하면
      인증키와 함께 상세 명세(엔드포인트·요청인자·응답 필드)가 발급됩니다.
      명세를 받으면 위 endpoint 와 아래 request/field_map 을 채우고
      `python main.py doctor --probe` 로 확인하십시오.
      집계 플랫폼이므로 KCI·NKIS·법령정보 등 개별 소스와 동일 자료가 중복될 수 있으나,
      DOI·공식 ID·파일 해시 기준 다단계 중복제거(§11)가 걸러냅니다.
      원문은 원 기관 사이트에 있으므로 기본 정책은 link_only 로 두고,
      기관별 이용조건을 확인한 뒤에만 다운로드로 전환하십시오.

  - source_id: prism
    name: "PRISM 정책연구관리시스템"
    base_domain: prism.go.kr
    connector: prism
    mode: [FULL, QUERY]
    query_language: ko
    priority: 2
    enabled: true
    access_methods:
      # 공공데이터포털 '행정안전부_정책연구 과제정보'(15080254) 기준.
      # 제공 오퍼레이션: getResearchList_v2 / getResearchDetail_v2 / pnnMetaData_v2
      - type: OPEN_API
        auth_type: API_KEY
        credential_required: true
        credential_env_var: DATA_GO_KR_API_KEY
        endpoint: "https://apis.data.go.kr/1741000/prism_v2/getResearchList_v2"
        detail_endpoint: "https://apis.data.go.kr/1741000/prism_v2/getResearchDetail_v2"
        verification_status: VERIFIED
        verified_source: "https://www.data.go.kr/data/15080254/openapi.do"
        verified_at: "2026-08-22"
        verified_method: web_search
    credential_guide_required: true
    auth_docs_url: "https://www.data.go.kr/data/15080254/openapi.do"
    contact_or_policy_url: "https://www.prism.go.kr"
    robots_policy: respect
    terms_checked_at: "2026-08-22"
    last_policy_review_at: "2026-08-22"
    download_policy: allowed
    rate_limit_rps: 0.5
    lookback_days: 3
    notes: >-
      공공데이터포털 인증키는 Encoding/Decoding 두 가지가 발급됩니다.
      응답 필드명은 데이터셋 상세페이지의 '출력결과' 표를 확인해 field_map 을 조정하십시오.

  - source_id: law_go_kr
    name: "국가법령정보 공동활용"
    base_domain: law.go.kr
    connector: law_openapi
    mode: [FULL, QUERY]
    query_language: ko
    priority: 1
    enabled: true
    access_methods:
      # OPEN API 활용가이드 기준 요청변수: OC(사용자 식별자), target, type, query, display, page
      # 판례는 prncYd(선고일자 범위), 법령은 efYd/ancYd 계열 파라미터를 지원합니다.
      - type: OPEN_API
        auth_type: API_KEY
        credential_required: true
        credential_env_var: LAW_GO_KR_OC
        endpoint: "https://www.law.go.kr/DRF/lawSearch.do"
        detail_endpoint: "https://www.law.go.kr/DRF/lawService.do"
        verification_status: VERIFIED
        verified_source: "https://open.law.go.kr/LSO/openApi/guideList.do"
        verified_at: "2026-08-22"
        verified_method: web_search
    credential_guide_required: true
    auth_docs_url: "https://open.law.go.kr/LSO/openApi/guideList.do"
    contact_or_policy_url: "https://open.law.go.kr/LSO/openApi/guideResult.do"
    robots_policy: respect
    terms_checked_at: "2026-08-22"
    last_policy_review_at: "2026-08-22"
    download_policy: link_only
    rate_limit_rps: 1.0
    lookback_days: 7
    # 공포일·시행일·개정일을 분리 저장하여 신규/개정을 구분 (§4.2 F)
    # 확인된 target 코드: law(법령) admrul(행정규칙) prec(판례) expc(법령해석례) ordin(자치법규)
    law_targets: ["law", "admrul", "prec"]
    # 한 번에 요청할 목록 건수 (공식 가이드의 display 파라미터)
    law_display: 100
    # 판례 목록 조회의 선고일자 범위 파라미터명
    law_date_param:
      prec: prncYd
    notes: >-
      OC 는 신청 시 부여되는 사용자 식별자입니다(API Key 는 아니지만 동일하게 .env 로 관리).
      동일 데이터가 공공데이터포털에도 등재되어 있습니다(예: 법제처_판례 목록 조회 15059269).

  # ===========================================================================
  # 국내 기관형 법률·국방 소스 (§4.3)
  #  - 공식 RSS/Atom 이 확인된 기관만 FEED 로 운영합니다.
  #  - feed_url 이 비어 있으면 자동수집을 시도하지 않고 LINK_ONLY 로 유지합니다.
  # ===========================================================================

  - source_id: nars
    name: "국회입법조사처"
    base_domain: nars.go.kr
    # 공식 RSS 대신 공공데이터포털 Open API 를 사용합니다(§4.1 우선순위 1).
    connector: nars
    mode: [FEED, QUERY]
    query_language: ko
    priority: 2
    enabled: true
    access_methods:
      # 공공데이터포털 '국회사무처_국회입법조사처 연구보고서(NARS 현안분석)'(15125970).
      # 상세 오퍼레이션 경로는 데이터셋 상세페이지에서 확인해 채워야 합니다.
      - type: OPEN_API
        auth_type: API_KEY
        credential_required: true
        credential_env_var: DATA_GO_KR_API_KEY
        endpoint: "https://apis.data.go.kr/9735000/PublicationService/getResearchReportList"
        verification_status: PENDING_VERIFICATION
        verified_source: "https://www.data.go.kr/data/15125970/openapi.do"
        verified_at: "2026-08-22"
        verified_method: web_search
    credential_guide_required: true
    auth_docs_url: "https://www.data.go.kr/data/15125970/openapi.do"
    contact_or_policy_url: "https://www.nars.go.kr/report/list.do?cmsCode=CM0043"
    robots_policy: respect
    terms_checked_at: "2026-08-22"
    last_policy_review_at: "2026-08-22"
    download_policy: manual_review
    rate_limit_rps: 0.3
    lookback_days: 7
    landing_url_template: "https://www.nars.go.kr/report/view.do?cmsCode=CM0043&brdSeq={id}"
    notes: >-
      공식 RSS 주소는 확인되지 않았습니다. 대신 공공데이터포털에 연구보고서(15125970)와
      제공자료 통합 API(15126137)가 등재되어 있으므로 그 상세주소를 endpoint 에 입력하십시오.
      열린국회정보(open.assembly.go.kr)도 대체 경로로 검토할 수 있습니다.

  - source_id: jpri
    name: "사법정책연구원"
    base_domain: jpri.scourt.go.kr
    connector: institution_feed
    mode: [FEED]
    query_language: ko
    priority: 2
    enabled: true
    access_methods:
      - type: RSS
        auth_type: NONE
        credential_required: false
        credential_env_var: null
        endpoint: "https://metalink.k-knowledge.kr/search/openapi/search"
        verification_status: PENDING_VERIFICATION
        verified_source: "https://jpri.scourt.go.kr/post/postList.do?boardSeq=7&menuSeq=11&lang=ko"
        verified_at: "2026-08-22"
