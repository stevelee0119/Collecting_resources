# =============================================================================
# Source Registry (PRD v2.1 §5)
#
# 모든 출처는 여기에 등록합니다. 코드에 도메인·엔드포인트를 하드코딩하지 않습니다.
#
# verification_status 값의 의미:
#   VERIFIED             - 공식 문서를 확인하여 엔드포인트/인증방식을 확정함
#   PENDING_VERIFICATION - Connector 구현·운영 직전 공식 문서 재확인 필요 (§5.1 최신성 원칙)
#
# credential_env_var 에는 "변수명"만 적습니다. 실제 키는 .env 에 보관하고
# 절대 이 파일이나 docs/ 문서에 기록하지 않습니다 (§5.1 보안 원칙).
# =============================================================================

registry_version: "2026.08.22-1"

defaults:
  robots_policy: respect
  max_concurrency: 2
  retry_policy:
    max_attempts: 3
    backoff: exponential
  lookback_days: 3

sources:

  # ===========================================================================
  # 국내 학술·정책 핵심 소스 (§4.2)
  # ===========================================================================

  - source_id: kci
    name: "KCI 한국학술지인용색인"
    base_domain: kci.go.kr
    connector: kci
    mode: [QUERY, FEED]
    query_language: ko
    priority: 1
    enabled: true
    access_methods:
      - type: OAI_PMH
        auth_type: NONE
        credential_required: false
        credential_env_var: null
        endpoint: "https://open.kci.go.kr/po/openapi/oai"
        verification_status: PENDING_VERIFICATION
      - type: OPEN_API
        auth_type: API_KEY
        credential_required: true
        credential_env_var: KCI_API_KEY
        endpoint: "https://open.kci.go.kr/po/openapi/openApiSearch.kci"
        verification_status: PENDING_VERIFICATION
    credential_guide_required: true
    auth_docs_url: "https://open.kci.go.kr"
    contact_or_policy_url: "https://www.kci.go.kr"
    robots_policy: respect
    terms_checked_at: "2026-08-22"
    last_policy_review_at: "2026-08-22"
    download_policy: oa_only
    rate_limit_rps: 0.5
    lookback_days: 3
    oai_metadata_prefix: "oai_dc"
    notes: "OAI-PMH 는 키 없이 사용할 수 있는 공개 메타데이터 경로로 우선 검토(§4.2 A)."

  - source_id: riss
    name: "RISS 학술연구정보서비스"
    base_domain: riss.kr
    connector: riss
    mode: [QUERY, LINK_ONLY]
    query_language: ko
    priority: 2
    enabled: true
    access_methods:
      - type: OPEN_API
        auth_type: INSTITUTION_APPROVAL
        credential_required: true
        credential_env_var: RISS_API_KEY
        endpoint: ""
        verification_status: PENDING_VERIFICATION
    credential_guide_required: true
    auth_docs_url: "https://www.riss.kr"
    contact_or_policy_url: "https://www.riss.kr"
    robots_policy: respect
    terms_checked_at: "2026-08-22"
    last_policy_review_at: "2026-08-22"
    # 승인 전에는 대량 크롤링하지 않고 Landing Page 만 보존 (§4.2 B)
    download_policy: link_only
    rate_limit_rps: 0.2
    lookback_days: 3
    notes: "Open API 미승인 상태에서는 직접 크롤링 금지. 화면상 '원문있음'을 다운로드 권한과 동일시하지 않음."

