# 웹 크롤링 및 수집 프로그램 설정 파일 (config.yaml)

# 수집 운영 모드 설정
# mode 1: PDF 자동 다운로드 (downloads/YYYY-MM-DD/ 저장) 및 수집 완료 목록 메일 전송
# mode 2: 파일 다운로드 없이 3단계 검증된 원문/게시글 링크 메일 전송
mode: 1

# 수집 방식 설정 (all_period_documents: 기간 내 업로드 파일 전수 수집 / keyword_search: 키워드 수집)
collection_scope: "all_period_documents"

# 정기 자동화 실행 일정 설정 (매월 1일 오전 09:00)
schedule:
  frequency: "monthly"
  day_of_month: 1
  time: "09:00"

# 메일 발송 (SMTP) 설정
email:
  enabled: true
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  sender_email: "cptleecm@gmail.com"
  sender_password: "aisr iucm drvs hmom"  # Gmail 앱 비밀번호
  receiver_email: "mrleechangmin@gmail.com"

# 수집 설정 (최초 실행: 2026.01.01 ~ 2026.07.31 / 이후 실행: 최근 1개월 이내)
crawler:
  max_results_per_institution: 20
  first_run_range:
    start_date: "2026-01-01"
    end_date: "2026-07-31"

